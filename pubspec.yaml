name: mindflow
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  get_it: ^8.2.0
  go_router: ^16.2.4
  fl_chart: ^1.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  #Firebase packages
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: merriweather
      fonts:
        - asset: assets/fonts/merriweather-variable.ttf
    - family: quicksand
      fonts:
        - asset: assets/fonts/quicksand-variable.ttf

